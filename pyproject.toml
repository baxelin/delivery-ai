[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-ai"
version = "0.1.0"
description = "Assistente de delivery com IA: sentimento, LLM, busca semântica e agente."
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
